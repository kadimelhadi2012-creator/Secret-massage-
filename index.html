<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة سرية 💗</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #ffeaf3;
    text-align: center;
    padding: 50px 20px;
    color: #5a2940;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    font-size: 28px;
}

input {
    padding: 13px;
    width: 80%;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    text-align: center;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 12px;
    background: #e889ad;
    color: white;
    font-size: 16px;
}

#message {
    display: none;
    margin-top: 25px;
    line-height: 2;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="box">
    <h1>💌 عندي رسالة ليك</h1>

    <p>اكتب الرمز عشان تشوفها 👀</p>

    <input type="password" id="code" placeholder="اكتب الرمز">

    <br>

    <button onclick="showMessage()">افتح الرسالة 💗</button>

    <p id="error"></p>

    <div id="message">
        بحبك اوي ياروحي و مقدرش تزعل مني ثانيه واحده عارفه اني بزعلك كتير بس انا اسفه والله
